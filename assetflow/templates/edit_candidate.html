{% extends "base.html" %}
{% block title %}编辑候选交易 - AssetFlow{% endblock %}
{% block content %}
<section class="page-header">
  <h1>编辑候选交易</h1>
  <a class="button-link secondary" href="/ui/review">返回审核</a>
</section>
{% if error %}<section class="panel error"><h2>保存失败</h2><p>{{ error }}</p></section>{% endif %}
<form class="panel edit-form" method="post" action="/ui/review/{{ candidate.id }}/edit">
  <label>市场 <input name="market" value="{{ candidate.market or '' }}" placeholder="HK"></label>
  <label>证券代码 <input name="symbol" value="{{ candidate.symbol or '' }}" placeholder="00700"></label>
  <label>证券名称 <input name="security_name" value="{{ candidate.security_name or '' }}" placeholder="Tencent"></label>
  <label>交易类型
    <select name="trade_type">
      <option value="">请选择</option>
      {% for value, label in trade_types.items() %}
        <option value="{{ value }}" {% if candidate.trade_type == value %}selected{% endif %}>{{ label }} ({{ value }})</option>
      {% endfor %}
    </select>
  </label>
  <label>交易日期 <input name="trade_date" value="{{ candidate.trade_date or '' }}" placeholder="YYYY-MM-DD"></label>
  <label>交易时间 <input name="trade_time" value="{{ candidate.trade_time or '' }}" placeholder="HH:MM:SS"></label>
  <label>数量 <input name="quantity" value="{{ candidate.quantity or '' }}" inputmode="decimal"></label>
  <label>价格 <input name="price" value="{{ candidate.price or '' }}" inputmode="decimal"></label>
  <label>成交金额 <input name="gross_amount" value="{{ candidate.gross_amount or '' }}" inputmode="decimal"></label>
  <label>净额 <input name="net_amount" value="{{ candidate.net_amount or '' }}" inputmode="decimal"></label>
  <label>佣金 <input name="commission" value="{{ candidate.commission or '' }}" inputmode="decimal"></label>
  <label>费用 <input name="fees" value="{{ candidate.fees or '' }}" inputmode="decimal"></label>
  <label>币种
    <select name="currency">
      <option value="">请选择</option>
      {% for value in currencies %}
        <option value="{{ value }}" {% if candidate.currency == value %}selected{% endif %}>{{ value }}</option>
      {% endfor %}
    </select>
  </label>
  <label>成交后持仓 <input name="position_balance_after" value="{{ candidate.position_balance_after or '' }}" inputmode="decimal"></label>
  <div class="form-actions">
    <button type="submit">保存</button>
    <a class="button-link secondary" href="/ui/review">取消</a>
  </div>
</form>
{% endblock %}
